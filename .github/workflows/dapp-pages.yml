name: Deploy dApp to GitHub Pages

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [dapp_production]

  pull_request:
    branches: [dapp_production]

  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy dApp
    runs-on: ubuntu-latest
    environment:
      name: dapp-pages
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contract clients
        run: npm run install:contracts

      - name: Build app
        env:
          PUBLIC_STELLAR_NETWORK_PASSPHRASE:
            ${{ vars.PUBLIC_STELLAR_NETWORK_PASSPHRASE }}
          PUBLIC_STELLAR_RPC_URL: ${{ vars.PUBLIC_STELLAR_RPC_URL }}
          PUBLIC_STELLAR_HORIZON_URL: ${{ vars.PUBLIC_STELLAR_HORIZON_URL }}
        run: npm run build

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./dist
          clean-exclude: pr-preview

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
