name: Relayer Docker image

# Ships the self-hosting image the RFP promises: every push to main that
# touches the relayer (or the SDK it builds on) publishes
# ghcr.io/theahaco/authline-relayer:latest plus a commit-pinned tag.

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
    paths:
      - "packages/relayer/**"
      - "packages/authline-sdk/**"
      - "package-lock.json"
      - ".github/workflows/relayer-image.yml"
  workflow_dispatch:

concurrency:
  group: relayer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relayer/Dockerfile
          push: true
          tags: |
            ghcr.io/theahaco/authline-relayer:latest
            ghcr.io/theahaco/authline-relayer:${{ github.sha }}
