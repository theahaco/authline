[workspace]
members = [
    "contracts/guess-the-number",
    "contracts/trustline-onboard",
    "contracts/authorizer-stub",
    "contracts/trustline-authorizer",
]
resolver = "2"

[workspace.package]
authors = ["The Aha Company"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/theahaco/authline"
version = "0.0.1"

[workspace.dependencies.soroban-sdk]
version = "26.0.0"

[profile.release]
opt-level = "z"
debug = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[profile.release-with-logs]
debug-assertions = true
inherits = "release"
